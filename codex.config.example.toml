# Add this to ~/.codex/config.toml to give Codex access to the ManySight platform.
# Adjust the path to wherever this repo lives.

[mcp_servers.manysight]
command = "python"
args = ["/workspace/mcp_server/server.py"]

[mcp_servers.manysight.env]
MANYSIGHT_URL = "http://localhost:8000"
# Only needed if you started the server with MANYSIGHT_API_KEY set:
# MANYSIGHT_API_KEY = "..."
# Only grant this to an MCP client authorized to resolve managed source connections:
# MANYSIGHT_CREDENTIAL_ACCESS_KEY = "..."

# For a hosted deployment, Codex can connect directly to the separately running
# Streamable HTTP MCP service. The bearer value stays in an environment variable:
# [mcp_servers.manysight_remote]
# url = "https://your-manysight-host.example/mcp"
# bearer_token_env_var = "MANYSIGHT_CLOUD_MCP_TOKEN"

